name: Gemini Docs Updater

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual triggering

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need at least 2 commits to get a diff
          
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: krkn
          environment-file: environment.yml
          python-version: "3.10"
          auto-activate-base: false
          
      - name: Run Gemini Docs Updater
        shell: bash -el {0}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/update_docs.py
          
      - name: Create Draft PR for Docs
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: automated updates by Gemini"
          title: "docs: Automated Documentation Updates"
          body: |
            This is an automated PR generated by the Gemini Docs Updater workflow.
            Please review the changes suggested by the Gemini API based on the recent code commits.
          branch: "docs/gemini-auto-update"
          delete-branch: true
          draft: true
          labels: "documentation, automated pr"
