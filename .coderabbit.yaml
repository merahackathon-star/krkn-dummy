version: 2
language: "en-US"
tone_and_style_guidelines: |
  Review the Python code for RESTful best practices, FastAPI conventions, and robust error handling.
  For Markdown documentation changes (in the `docs/` folder), ensure they are accurate, technically sound, and match the tone of the Docsy theme.
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poetry_run: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
chat:
  auto_reply: true
